name: sumaflow_digest_privacy_core
description: >-
  Privacy-critical modules of SumaFlow Digest — open-sourced under MIT so the
  on-device, no-cloud privacy contract (PRD §13, TECHSPEC §10) is independently
  verifiable.
version: 0.1.0
homepage: https://github.com/SumaFlow-App/sumaflow-digest-privacy-core
# Consumed by the main Digest app (private repo) via a pinned git `ref`, not a
# path dependency. Separate from sumaflow-minutes-privacy-core by design —
# separation of duties: each app owns and audits its own privacy core.
publish_to: 'none'

environment:
  sdk: ^3.11.3
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1  # crypto/key providers — matches the consuming app
  cryptography: ^2.7.0            # AES-256-GCM at-rest encryption + HKDF
  cryptography_flutter: ^2.3.2    # Platform-native AES-GCM / HMAC delegate
  flutter_secure_storage: ^9.2.2  # Android Keystore master-key store
  crypto: ^3.0.6                  # SHA-256 for the export audit hash
  # flutter_test is a *runtime* dependency on purpose: privacyManifestTests()
  # and the HTTP-asserting override live in lib/ (exported via testing.dart) so
  # any consuming app can run them through `flutter test`.
  flutter_test:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
